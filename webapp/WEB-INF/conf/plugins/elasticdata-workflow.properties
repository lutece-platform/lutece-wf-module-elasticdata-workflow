#############################################################################
# Configuration file of module workflow Elastic Search

# Resource types whose workflow history is indexed, comma separated
elasticdata-workflow.workflow.ressource.type.list=USERGRU

# WorkflowDataSource config
elasticdata-workflow.workflowDataSource.id=WorkflowDataSource
elasticdata-workflow.workflowDataSource.name=Historique des workflows
elasticdata-workflow.workflowDataSource.targetIndexName=workflowdatasource
elasticdata-workflow.workflowDataSource.fullIndexingDaemon=false
elasticdata-workflow.workflowDataSource.mappings={"mappings": {"properties": {"timestamp": {"type": "date","format": "yyyy-MM-dd HH:mm:ss||yyyy-MM-dd||epoch_millis"},"workflows.timestamp": {"type": "date","format": "yyyy-MM-dd HH:mm:ss||yyyy-MM-dd||epoch_millis"},"dateLastUpdate": {"type": "date","format": "yyyy-MM-dd HH:mm:ss||yyyy-MM-dd||epoch_millis"}}}}
